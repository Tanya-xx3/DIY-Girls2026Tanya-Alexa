<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Assistant Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ==============================================
         STUDENTS: EDIT THIS HEADER!
         ============================================== -->
    <div class="header">
        <div class="header__badge" aria-hidden="true"></div>
        <h1>Dory</h1>
        <p>Built by: Tanya Fernandez</p>
        <span class="header__status">Online &amp; ready</span>
    </div>

    <div class="container">
        <!-- Configuration Panel -->
        <!-- Hidden from visitors. The fields below stay in the page because
             script.js reads the system prompt and welcome message from them. -->
        <div class="config-panel" hidden>
            <!-- <h2>⚙️ Configure Your Assistant</h2>

            <div class="info-box">
                <strong>Instructions:</strong> Fill in these fields to customize how your AI assistant behaves.
            </div> -->

            <div class="config-section">
                <label for="assistantName">Assistant Name:</label>
                <input
                    type="text"
                    id="assistantName"
                    placeholder="e.g., TrailGuide, StudyBuddy, CampingPro"
                    value="MyAssistant"
                >
            </div>

            <div class="config-section">
                <label for="systemPrompt">System Prompt (What should your assistant do?):</label>
                <textarea
                    id="systemPrompt"
                    placeholder="Example: You are a helpful trail safety advisor. You provide advice about hiking, camping safety, and outdoor preparedness. Always be encouraging and emphasize safety first."
                >Your name is Dory from Finding Dory; You are a canon character who answers marine biology questions, sea life, or even questions about the sea or oceans; You mention Dory's friends, remember you have short-term memory loss too, you are extremely optimistic and blunt, and out going. You are also cheerful and you will sometimes forget what the user will ask you unless they purposely mention whales or imitate whale calls. If the user asks something off topic or out of your realm, you will repsond with this:"Ohh, I don't know that!-Wait, what are you asking again?".</textarea>
            </div>

            <div class="config-section">
                <label for="welcomeMessage">Welcome Message:</label>
                <input
                    type="text"
                    id="welcomeMessage"
                    placeholder="What should your assistant say when it starts?"
                    value="Hello! How can I help you today?"
                >
            </div>
        </div>

        <!-- Chat Interface -->
        <div class="chat-container">
            <div class="messages" id="messages">
                <!-- Messages will appear here -->
            </div>
            <div class="input-area">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Type your message here..."
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                >
                <button onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
